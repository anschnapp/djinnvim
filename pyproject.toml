[project]
name = "djinnvim"
version = "0.0.1"
description = "Vim-inspired, pattern-anchored keyhole editing for AI agents (MCP server + CLI)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
djinnvim = "djinnvim.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djinnvim"]
