<!doctype html>
<html lang="en">
<head>

<title>djinnvim benchmark — cost explorer</title>

    --control-active: #ffffff;
    --control-border: #d8d7d2;

    border-radius: 12px; padding: 20px 24px 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8b8a81;
      --grid: #2e2e2c;
      --axis: #45443f;
      --series-keyhole: #3987e5;
      --series-baseline: #008300;
      --series-nobash: #d55181;
      --fail: #ef6a6a;
      --tooltip-bg: #242422;
      --tooltip-border: #45443f;
      --control-bg: #242422;
      --control-active: #333330;
      --control-border: #45443f;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8b8a81;
    --grid: #2e2e2c;
    --axis: #45443f;
    --series-keyhole: #3987e5;

  .legend .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

  .tooltip {

  .tooltip .trials { color: var(--text-muted); font-variant-numeric: tabular-nums; margin-left: 14px; }
  .note { color: var(--text-muted); font-size: 0.72rem; margin-top: 10px; line-height: 1.5; }
  .task-info {
    margin-top: 12px; padding: 10px 14px; font-size: 0.8rem; line-height: 1.55;
    background: var(--control-bg); border: 1px solid var(--control-border); border-radius: 8px;
  }
  .task-info .ti-name { font-weight: 650; }
  .task-info p { color: var(--text-secondary); margin: 6px 0; }
  .task-info p b, .task-info p em { color: var(--text-primary); }
  .task-info blockquote {
    margin: 6px 0; padding: 2px 12px; font-style: italic;
    color: var(--text-secondary); border-left: 3px solid var(--control-border);
  }
  .task-info code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 0.92em;
    background: var(--surface-1); border: 1px solid var(--control-border);
    border-radius: 4px; padding: 0 4px;

  .task-info pre {
    background: var(--surface-1); border: 1px solid var(--control-border);
    border-radius: 6px; padding: 8px 12px; margin: 6px 0; overflow-x: auto;

  details { margin-top: 12px; font-size: 0.8rem; }
  summary { cursor: pointer; color: var(--text-secondary); }
  table { border-collapse: collapse; margin-top: 8px; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 0.75rem; }
  text { fill: var(--text-secondary); font-family: inherit; }

</head>
<body>
<div class="viz-root">
  <h1>djinnvim benchmark — cost per trial</h1>
  <div class="subtitle">Mean API cost (USD) per completed trial vs. file size. Aborted trials excluded.</div>

  <div class="filters">
    <div class="seg" role="group" aria-label="Model" id="modelSeg">
      <button data-model="haiku" aria-pressed="true">Haiku 4.5</button>
      <button data-model="sonnet" aria-pressed="false">Sonnet 5</button>
    </div>
    <select id="taskSel" aria-label="Task">
      <option value="__all__">All tasks (mean)</option>
    </select>
  </div>

  <div class="legend" id="legend"></div>

  <div class="chart-wrap">
    <svg id="chart" viewBox="0 0 760 400" role="img" aria-label="Line chart of mean cost per trial versus file size for the keyhole, baseline and no-bash conditions"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="task-info" id="taskInfo" hidden></div>

  <div class="note" id="note"></div>

  <details>
    <summary>Data table (current view)</summary>
    <div id="tableWrap"></div>
  </details>
</div>

// The three benchmark conditions, in fixed display order. Colors are CSS
// variables so they follow the light/dark theme.
const SERIES = [
  { key: "keyhole",  label: "keyhole (djinnvim)", cssVar: "--series-keyhole" },
  { key: "baseline", label: "baseline (all tools)", cssVar: "--series-baseline" },
  { key: "no-bash",  label: "no-bash (Bash denied)", cssVar: "--series-nobash" },
];
const SIZES = ["500", "2000", "10000"];   // file sizes = the x axis

// Current filter selection; render() reads this and redraws everything.
const state = { model: "haiku", task: "__all__" };

const svg = document.getElementById("chart");
const tooltip = document.getElementById("tooltip");
const wrap = document.querySelector(".chart-wrap");

// Resolve a CSS variable to its current value — looked up at render time so a
// theme change re-colors the SVG (whose attributes can't use var()) correctly.
const cssColor = v => getComputedStyle(document.querySelector(".viz-root")).getPropertyValue(v).trim();

// All trial records for one cell of the grid; "__all__" pools every task
// (that pooled mean is what the README's headline cost table reports).
function trials(model, cond, task, size) {
  if (task === "__all__") {
    const out = [];
    const tasks = DATA[model][cond] || {};
    for (const t of Object.keys(tasks)) out.push(...(tasks[t][size] || []));
    return out;
  }
  return ((DATA[model][cond] || {})[task] || {})[size] || [];
}
// Mean cost of a list of trials; null when the cell has no data.
const mean = a => a.length ? a.reduce((s, x) => s + x.cost, 0) / a.length : null;

// Suffix marker for a trial in tables/tooltips: nothing = byte-identical,
// "*" = AST-equal (formatting-only divergence), "✗" = semantically wrong
// output (silent failure), "?" = not byte-identical and unverifiable.
const trialMark = t => t.exact ? "" : t.sem === false ? "✗" : t.sem == null ? "?" : "*";

// Silent-failure / unverifiable counts for one condition under the current
// model+task selection (all sizes pooled) — shown next to the legend entries.
function failCounts(cond) {
  let fails = 0, unknown = 0;
  for (const size of SIZES)
    for (const t of trials(state.model, cond, state.task, size)) {
      if (t.exact) continue;
      if (t.sem === false) fails++;
      else if (t.sem == null) unknown++;
    }
  return { fails, unknown };
}

// Fill the task <select> from whatever tasks exist in DATA.
function buildTaskSelect() {
  const sel = document.getElementById("taskSel");
  const tasks = new Set();
  for (const m of Object.keys(DATA))
    for (const c of Object.keys(DATA[m]))
      for (const t of Object.keys(DATA[m][c])) tasks.add(t);
  for (const t of [...tasks].sort()) {
    const o = document.createElement("option");
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  }
  sel.addEventListener("change", () => { state.task = sel.value; render(); });
}

document.getElementById("modelSeg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  state.model = b.dataset.model;
  for (const btn of e.currentTarget.querySelectorAll("button"))
    btn.setAttribute("aria-pressed", String(btn === b));
  render();
});

// --- chart geometry (SVG viewBox units) ------------------------------------
// Wide right margin leaves room for the line-end labels ("keyhole $0.33").
const M = { top: 34, right: 150, bottom: 40, left: 56 };
const W = 760, H = 400;
const plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;
// x position of size column i: 3 evenly spaced columns, inset 8% from the edges.
const xPos = i => M.left + plotW * (0.08 + 0.84 * i / (SIZES.length - 1));

// Round the data maximum up to a clean top-of-axis value.
function niceMax(v) {
  if (v <= 0.25) return 0.25;
  if (v <= 0.5) return 0.5;
  if (v <= 1) return 1;
  if (v <= 1.5) return 1.5;
  if (v <= 2) return 2;
  return Math.ceil(v);
}

// What the chart currently shows, one entry per size column — kept around so
// the hover handler can find the nearest column without recomputing.
let current = []; // per size: {size, x, series:[{key,label,color,mean,trials}]}

// Full redraw from `state`: builds the SVG as a list of element strings
// (grid, axes, one line + markers per condition, collision-resolved end
// labels), then updates legend, task card, footnote, and data table.
function render() {
  const singleTask = state.task !== "__all__";
  current = SIZES.map((size, i) => ({
    size, x: xPos(i),
    series: SERIES.map(s => {
      const tr = trials(state.model, s.key, state.task, size);
      return { ...s, color: cssColor(s.cssVar), mean: mean(tr), trials: tr };
    }),
  }));

  // y scale: fit the means — and, in single-task view, the individual trial
  // dots too, since they spread wider than the means.
  let maxV = 0;
  for (const col of current)
    for (const s of col.series) {
      if (s.mean != null) maxV = Math.max(maxV, s.mean);
      if (singleTask) for (const t of s.trials) maxV = Math.max(maxV, t.cost);
    }
  const yMax = niceMax(maxV || 1);
  const y = v => M.top + plotH * (1 - v / yMax);

  const el = [];  // SVG elements as strings; joined into svg.innerHTML at the end

  // horizontal gridlines + y tick labels
  const ticks = 5;
  for (let k = 0; k <= ticks; k++) {
    const v = yMax * k / ticks, yy = y(v);
    el.push(`<line x1="${M.left}" x2="${W - M.right}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`);
    el.push(`<text x="${M.left - 8}" y="${yy + 3}" text-anchor="end" font-size="11">$${v.toFixed(2)}</text>`);
  }
  el.push(`<line x1="${M.left}" x2="${W - M.right}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>`);
  for (const col of current)
    el.push(`<text x="${col.x}" y="${H - 14}" text-anchor="middle" font-size="11">${Number(col.size).toLocaleString("en-US")} lines</text>`);
  el.push(`<text x="${M.left - 42}" y="${M.top - 16}" font-size="11">USD / trial</text>`);

  // crosshair (behind marks)
  el.push(`<line id="xhair" y1="${M.top}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`);

  // one line per condition: path through the means, faint per-trial dots
  // (single-task view only), ringed markers on the means, end label collected
  const endLabels = [];
  for (const [si, s] of SERIES.entries()) {
    const pts = current.map(c => ({ x: c.x, v: c.series[si].mean })).filter(p => p.v != null);
    if (!pts.length) continue;
    const color = cssColor(s.cssVar);
    el.push(`<path d="${pts.map((p, j) => `${j ? "L" : "M"}${p.x},${y(p.v)}`).join("")}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`);
    if (singleTask)
      for (const col of current)
        for (const t of col.series[si].trials) {
          const cy = y(t.cost);
          if (t.sem === false) {  // confirmed silent failure: red ✗ instead of a dot
            const r = 3.5;
            el.push(`<path d="M${col.x - r},${cy - r}L${col.x + r},${cy + r}M${col.x - r},${cy + r}L${col.x + r},${cy - r}" stroke="var(--fail)" stroke-width="1.8" stroke-linecap="round"/>`);
          } else {
            el.push(`<circle cx="${col.x}" cy="${cy}" r="2.5" fill="${color}" opacity="0.35"/>`);
          }
        }
    for (const p of pts)
      el.push(`<circle cx="${p.x}" cy="${y(p.v)}" r="4" fill="${color}" stroke="var(--surface-1)" stroke-width="2"/>`);
    const last = pts[pts.length - 1];
    endLabels.push({ x: last.x, yLine: y(last.v), yText: y(last.v), color, text: `${s.key} $${last.v.toFixed(2)}` });
  }
  // push overlapping end labels apart (min 14px vertical gap)
  endLabels.sort((a, b) => a.yText - b.yText);
  for (let k = 1; k < endLabels.length; k++)
    if (endLabels[k].yText - endLabels[k - 1].yText < 14)
      endLabels[k].yText = endLabels[k - 1].yText + 14;
  for (let k = endLabels.length - 1; k >= 0; k--) {
    if (endLabels[k].yText > y(0) - 2) endLabels[k].yText = y(0) - 2;
    if (k < endLabels.length - 1 && endLabels[k + 1].yText - endLabels[k].yText < 14)
      endLabels[k].yText = endLabels[k + 1].yText - 14;
  }
  for (const L of endLabels) {
    el.push(`<line x1="${L.x + 8}" x2="${L.x + 20}" y1="${L.yLine}" y2="${L.yText}" stroke="${L.color}" stroke-width="2" stroke-linecap="round"/>`);
    el.push(`<text x="${L.x + 25}" y="${L.yText + 3.5}" font-size="11" fill="var(--text-primary)">${L.text}</text>`);
  }
  svg.innerHTML = el.join("");

  document.getElementById("legend").innerHTML = SERIES.map(s => {
    const fc = failCounts(s.key);
    return `<span class="item"><span class="swatch" style="background:${cssColor(s.cssVar)}"></span>${s.label}` +
      (fc.fails ? `&ensp;<span style="color:var(--fail);font-weight:600">✗ ${fc.fails} silent fail${fc.fails > 1 ? "s" : ""}</span>` : "") +
      (fc.unknown ? `&ensp;<span style="color:var(--text-muted)">? ${fc.unknown} unverified</span>` : "") +
      `</span>`;
  }).join("");

  const ti = document.getElementById("taskInfo");
  const info = TASK_INFO[state.task];
  if (singleTask && info) {
    ti.hidden = false;
    ti.innerHTML = `<div class="ti-name">${info.title}</div>` + info.html;
  } else {
    ti.hidden = true;
  }

  document.getElementById("note").textContent =
    (singleTask ? "Faint dots are individual trials (a red ✗ is a trial whose output was semantically wrong — a silent failure); large markers are cell means. " :
      "Each point is the mean over all 7 tasks × 3 trials at that size. ") +
    (state.model === "sonnet" && (state.task === "purge-blocks" || state.task === "__all__")
      ? "Note: sonnet no-bash on purge-blocks @ 10,000 lines required a raised per-trial budget ($8; the default $3 cap aborted five straight attempts) — its two clean trials cost $4.61 and $4.66."
      : "");

  renderTable();
}

function renderTable() {
  const rows = SERIES.map(s => {
    const cells = current.map(col => {
      const cs = col.series.find(x => x.key === s.key);
      if (cs.mean == null) return "<td>—</td>";
      const tr = cs.trials.map(t => {
        const label = `$${t.cost.toFixed(2)}${trialMark(t)}`;
        return t.sem === false ? `<span style="color:var(--fail)">${label}</span>` : label;
      }).join(", ");
      return `<td>$${cs.mean.toFixed(2)} <span style="color:var(--text-muted)">(${tr})</span></td>`;
    }).join("");
    return `<tr><td>${s.label}</td>${cells}</tr>`;
  }).join("");
  document.getElementById("tableWrap").innerHTML =
    `<table><thead><tr><th>condition</th>${SIZES.map(s => `<th>${Number(s).toLocaleString("en-US")} lines — mean (trials)</th>`).join("")}</tr></thead>` +
    `<tbody>${rows}</tbody></table>` +
    `<div class="note">* = not byte-identical but AST-equal (formatting-only divergence) &nbsp;·&nbsp; ✗ = semantically wrong output (silent failure) &nbsp;·&nbsp; ? = not byte-identical, workdir pruned before the AST check (unverified). See README for exact vs. semantic grading.</div>`;
}

// --- hover: crosshair + tooltip --------------------------------------------
// Snap to the nearest size column and show every condition's mean and trials.
svg.addEventListener("mousemove", e => {
  // mouse position in viewBox coordinates (the SVG scales with its container)
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  let best = null, bd = Infinity;
  for (const col of current) {
    const d = Math.abs(col.x - p.x);
    if (d < bd) { bd = d; best = col; }
  }
  if (!best || p.x < M.left - 10 || p.x > W - M.right + 40) { hideTip(); return; }
  const xh = svg.querySelector("#xhair");
  if (xh) { xh.setAttribute("x1", best.x); xh.setAttribute("x2", best.x); xh.setAttribute("visibility", "visible"); }
  tooltip.style.display = "block";
  tooltip.innerHTML =
    `<div class="tt-title">${Number(best.size).toLocaleString("en-US")} lines</div>` +
    best.series.map(s => s.mean == null ? "" :
      `<div class="row"><span class="dot" style="background:${s.color}"></span>` +
      `<span class="name">${s.key}</span><span class="val">$${s.mean.toFixed(2)}</span></div>` +
      `<div class="trials">${s.trials.length} trials: ${s.trials.map(t => t.cost.toFixed(2) + trialMark(t)).join(", ")}</div>`
    ).join("");
  const wr = wrap.getBoundingClientRect();
  const scale = wr.width / W;
  let lx = best.x * scale + 14;
  if (lx + tooltip.offsetWidth > wr.width - 8) lx = best.x * scale - tooltip.offsetWidth - 14;
  tooltip.style.left = lx + "px";
  tooltip.style.top = Math.max(4, e.clientY - wr.top - 30) + "px";
});
svg.addEventListener("mouseleave", hideTip);
function hideTip() {
  tooltip.style.display = "none";
  const xh = svg.querySelector("#xhair");
  if (xh) xh.setAttribute("visibility", "hidden");
}

// Redraw on OS theme change so SVG colors (resolved at render time) follow.
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
buildTaskSelect();
render();
</script>
</body>
</html>
